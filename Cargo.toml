[package]
name = "aiyt"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
ureq = { version = "2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
