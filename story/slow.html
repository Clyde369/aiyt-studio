<!doctype html>
<!--
  AIYT Studio story part, Slow style: AI pictures that keep moving, word-timed captions with a colour per speaker,
  hook title on frame 0, sound effects and music. The app fills {{TOTAL}}, {{SHOTS}}, {{AUDIO}} and {{DATA}}.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="{{TOTAL}}" data-safe-zone="shorts">
<head>
<meta charset="utf-8">
<style>
  body { background: #111; color: #fff; font-family: Nunito, Inter, sans-serif; overflow: hidden; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .wrap { position: absolute; inset: 0; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
  .shot::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgb(0 0 0 / .42) 0%, transparent 20%, transparent 50%, rgb(0 0 0 / .5) 100%); }
  #hook { position: absolute; left: 70px; right: 70px; top: 240px; margin: 0; text-align: center; z-index: 5;
    font-size: 112px; font-weight: 900; line-height: .98; letter-spacing: -.03em; text-transform: uppercase;
    -webkit-text-stroke: 5px #111; paint-order: stroke fill; text-shadow: 0 10px 30px rgb(0 0 0 / .6); }
  #hook .w { display: inline-block; }
  .cap { position: absolute; left: 60px; right: 60px; top: 900px; text-align: center; isolation: isolate; z-index: 6;
    font-size: 80px; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; text-transform: uppercase; }
  .cap .w { display: inline-block; padding: 0 .12em; color: #fff; -webkit-text-stroke: 3px #111; paint-order: stroke fill;
    text-shadow: 0 6px 20px rgb(0 0 0 / .55); }
  .pill { position: absolute; left: 0; top: .03em; height: 1.06em; border-radius: .22em; z-index: -1; background: var(--c);
    box-shadow: 0 10px 36px rgb(0 0 0 / .35); }
  .tag { position: absolute; left: 50%; top: -66px; translate: -50% 0; font-size: 34px; font-weight: 900; letter-spacing: .1em;
    padding: 6px 20px; border-radius: 999px; background: #111; color: var(--c); white-space: nowrap; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 7; }
</style>
</head>
<body>
<main class="scene" data-camera="float 6">
{{SHOTS}}
  <h1 id="hook"></h1>
  <div id="caps"></div>
  <div id="flash"></div>
</main>
{{AUDIO}}
<script>
const data = {{DATA}};
const tl = gm.timeline();
const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Hook: on screen at frame 0 (it is the thumbnail), then it gets out of the way.
document.getElementById('hook').innerHTML = String(data.hook || '').split(' ').map(w => `<span class="w">${esc(w)}</span>`).join(' ');
tl.from('#hook .w', { y: 70, scale: 1.3, opacity: .3, filter: 'blur(10px)', duration: .45, ease: 'expo.out', stagger: .06 }, 0)
  .to('#hook', { scale: .8, y: -60, opacity: 0, duration: .3, ease: 'power2.in' }, 2.6);

// Shots: each picture keeps moving; later ones whip in from alternating sides. Tweens inside a shot count from
// that shot's own start, so every shot gets its own timeline.
data.scenes.forEach((sc, i) => {
  const st = gm.timeline(`#s${i}`), d = sc.end - sc.start + .35;
  if (i) st.fromTo('.wrap', { x: i % 2 ? 1080 : -1080, filter: 'blur(16px)' }, { x: 0, filter: 'blur(0px)', duration: .3, ease: 'expo.out' }, 0);
  const m = sc.camera;
  if (m === 'push_in') st.fromTo('img', { scale: 1.02 }, { scale: 1.16, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pull_out') st.fromTo('img', { scale: 1.2 }, { scale: 1.03, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pan_left') st.fromTo('img', { scale: 1.16, x: 60 }, { x: -60, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pan_right') st.fromTo('img', { scale: 1.16, x: -60 }, { x: 60, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'punch_zoom') {
    st.fromTo('img', { scale: 1 }, { scale: 1.3, duration: .18, ease: 'expo.out' }, .05)
      .to('img', { scale: 1.2, duration: d - .3, ease: 'sine.inOut' }, .25);
    tl.fromTo('#flash', { opacity: .55 }, { opacity: 0, duration: .25, ease: 'power2.out' }, sc.start + .05);
  } else st.fromTo('img', { scale: 1.12 }, { scale: 1.18, duration: d, ease: 'sine.inOut' }, 0);
});
const shakes = data.scenes.filter(s => s.camera === 'shake').map(s => s.start + .1);
gm.onFrame(t => {
  let sx = 0, sy = 0;
  for (const s of shakes) { const u = t - s; if (u >= 0 && u < .7) { const a = 22 * Math.exp(-6 * u); sx += a * Math.sin(u * 63); sy += a * Math.cos(u * 51); } }
  document.querySelectorAll('.shot').forEach(el => { el.style.translate = `${sx}px ${sy}px`; });
});

// Captions: 1-3 word phrases, a sliding pill in the speaker's colour, a name tag for characters.
const colour = (who) => (data.cast[who] && data.cast[who].caption) || '#ffd23f';
const phrases = [[]];
data.words.forEach((w, i) => {
  const cur = phrases.at(-1), prev = data.words[i - 1];
  if (cur.length && (cur.length === 3 || w.speaker !== prev.speaker || w.start - prev.end > .3 || /[.!?,]$/.test(prev.text))) phrases.push([]);
  phrases.at(-1).push(w);
});
const caps = phrases.map(ph => {
  const el = document.createElement('div'); el.className = 'cap'; el.style.setProperty('--c', colour(ph[0].speaker));
  const tag = ph[0].speaker !== 'narrator' ? `<span class="tag">${esc(ph[0].speaker.toUpperCase())}</span>` : '';
  el.innerHTML = tag + '<i class="pill"></i>' + ph.map(w => `<span class="w">${esc(w.text)}</span>`).join(' ');
  document.getElementById('caps').append(el); return el;
});
gm.wait(document.fonts.ready.then(() => phrases.forEach((ph, p) => {
  const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
  const box = i => ({ x: spans[i].offsetLeft, y: spans[i].offsetTop, width: spans[i].offsetWidth });
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .01 }, ph[0].start - .07);
  tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .2, ease: 'back.out(2)' }, ph[0].start - .04);
  ph.forEach((w, i) => {
    tl.fromTo(spans[i], { opacity: 0, y: 36, scale: .6, rotate: (i % 2 ? 5 : -5) }, { opacity: 1, y: 0, scale: 1, rotate: 0, duration: .26, ease: 'back.out(2.6)' }, w.start - .06);
    if (i) tl.to(pill, { ...box(i), duration: .12, ease: 'power3.out' }, w.start - .1);
    tl.to(spans[i], { color: '#111', webkitTextStroke: '0px #111', scale: 1.06, duration: .06 }, w.start - .03)
      .to(spans[i], { color: '#fff', webkitTextStroke: '3px #111', scale: 1, duration: .06 }, ph[i + 1] ? ph[i + 1].start - .1 : w.end + .25);
  });
  const end = next ? next[0].start - .16 : ph.at(-1).end + .35;
  tl.to(el, { y: -50, opacity: 0, duration: .14, ease: 'power2.in' }, end);
})));
</script>
</body>
</html>
