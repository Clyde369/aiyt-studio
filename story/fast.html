<!doctype html>
<!--
  AIYT Studio "Fast" story renderer: a whole comedy Short drawn in code.
  Look: flat-vector cartoon. Characters: bold #231c35 outlines, vibrant fills, cel-shade crescent + white gleams.
        Backgrounds: softer, thinner lighter outlines, slight vignette, ambient motion (clocks, clouds, lights).
  Type: Nunito 900 uppercase captions, coloured pill per speaker sliding to the spoken word, name tag above.
  Motion: everything is computed from the video time in one onFrame (frame-exact, works as a still at any t):
          scenes whip in sideways, camera per scene, idle breathing + blinks, lip-sync from the line's audio level,
          talk squash/tilt, a hop when a line starts, others dim, moods, actions.
  Placeholders filled by the app: TOTAL, AUDIO, DATA (see contract in the app).
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="{{TOTAL}}" data-safe-zone="shorts">
<head>
<meta charset="utf-8">
<style>
  body { background: #1a1530; color: #fff; font-family: Nunito, Inter, sans-serif; overflow: hidden; margin: 0; }
  .shot { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .wrap, .cam { position: absolute; inset: 0; }
  .cam { transform-origin: 540px 1250px; }
  .bg { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; }
  .bg svg { display: block; width: 100%; height: 100%; }
  .ch { position: absolute; }
  .rig { position: absolute; inset: 0; transform-origin: 50% 100%; }
  .rig > svg { position: absolute; inset: 0; overflow: visible; }
  .shd { position: absolute; left: 12%; right: 12%; bottom: -16px; height: 32px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(30 18 52 / .42), rgb(30 18 52 / .18) 70%, transparent); }
  /* face parts */
  .eyes, .eo, .pup, .brow, .mc, .mo { transform-box: fill-box; transform-origin: center; }
  .mo { transform-origin: 50% 0; opacity: 0; }
  .mv { display: none; }
  .ch[data-mood=neutral] .neutral, .ch[data-mood=happy] .happy, .ch[data-mood=angry] .angry, .ch[data-mood=sad] .sad,
  .ch[data-mood=shocked] .shocked, .ch[data-mood=smug] .smug, .ch[data-mood=scared] .scared, .ch[data-mood=dead] .dead { display: inline; }
  .ch[data-mood=dead] .eo, .ch[data-mood=dead] .brow { display: none; }
  .ch[data-mood=happy] .brow { transform: translateY(-7px); }
  .ch[data-mood=angry] .brow.l { transform: translateY(9px) rotate(22deg); }
  .ch[data-mood=angry] .brow.r { transform: translateY(9px) rotate(-22deg); }
  .ch[data-mood=sad] .brow.l { transform: translateY(-2px) rotate(-18deg); }
  .ch[data-mood=sad] .brow.r { transform: translateY(-2px) rotate(18deg); }
  .ch[data-mood=shocked] .brow { transform: translateY(-18px); }
  .ch[data-mood=smug] .brow.l { transform: translateY(7px) rotate(8deg); }
  .ch[data-mood=smug] .brow.r { transform: translateY(-14px) rotate(-10deg); }
  .ch[data-mood=scared] .brow.l { transform: translateY(-12px) rotate(-18deg); }
  .ch[data-mood=scared] .brow.r { transform: translateY(-12px) rotate(18deg); }
  .ch[data-mood=shocked] .pup, .ch[data-mood=scared] .pup { transform: scale(.6); }
  .ch[data-mood=happy] .pup { transform: scale(1.08); }
  .ch[data-mood=shocked] .eo { transform: scale(1.14); }
  /* ambient loops (run on the virtual clock) */
  @keyframes spin { to { transform: rotate(360deg); } }
  .tick { transform-box: view-box; animation: spin 60s steps(60) infinite; }
  .spin { transform-box: view-box; animation: spin 7s linear infinite; }
  .slow { transform-box: view-box; animation: spin 40s linear infinite; }
  @keyframes drift { from { transform: translateX(-460px); } to { transform: translateX(1560px); } }
  .drift { animation: drift 70s linear infinite; }
  @keyframes float { 0%, 100% { transform: translateX(-34px); } 50% { transform: translateX(34px); } }
  .float { animation: float 9s ease-in-out infinite; }
  @keyframes blk { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .18; } }
  .blk { animation: blk 1.6s steps(1) infinite; }
  @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .tw { animation: tw 2.4s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  .sway { transform-box: view-box; animation: sway 3.4s ease-in-out infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 25% { opacity: .85; } 100% { transform: translateY(-150px) scale(1.25); opacity: 0; } }
  .rise { transform-box: fill-box; transform-origin: center; animation: rise 2.6s ease-out infinite; }
  @keyframes glw { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }
  .glw { animation: glw 3s ease-in-out infinite; }
  @keyframes shoot { 0%, 78% { transform: translate(0, 0); opacity: 0; } 80% { opacity: 1; } 100% { transform: translate(-760px, 380px); opacity: 0; } }
  .shoot { animation: shoot 5s linear infinite; }
  @keyframes drip { 0%, 55% { transform: translateY(0); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(70px); opacity: 0; } }
  .drip { animation: drip 2.2s ease-in infinite; }
  @keyframes wag { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  .wag { transform-box: view-box; animation: wag .45s ease-in-out infinite; }
  .swish { transform-box: view-box; animation: wag 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .bob { animation: bob 1.4s ease-in-out infinite; }
  /* text */
  #hook { position: absolute; left: 70px; right: 70px; top: 250px; margin: 0; text-align: center; z-index: 5;
    font-size: 112px; font-weight: 900; line-height: .98; letter-spacing: -.03em; text-transform: uppercase;
    -webkit-text-stroke: 5px #1a1230; paint-order: stroke fill; text-shadow: 0 10px 30px rgb(20 10 40 / .55); }
  #hook .w { display: inline-block; }
  #hook .w:nth-child(3n+2) { color: #ffd23f; }
  .cap { position: absolute; left: 60px; right: 60px; top: 830px; text-align: center; isolation: isolate; z-index: 6;
    font-size: 80px; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; text-transform: uppercase; }
  .cap .w { display: inline-block; padding: 0 .12em; color: #fff; -webkit-text-stroke: 3px #1a1230; paint-order: stroke fill;
    text-shadow: 0 6px 20px rgb(20 10 40 / .55); }
  .pill { position: absolute; left: 0; top: .03em; height: 1.06em; border-radius: .22em; z-index: -1; background: var(--c);
    box-shadow: 0 10px 36px rgb(20 10 40 / .35); }
  .tag { position: absolute; left: 50%; top: -66px; translate: -50% 0; font-size: 34px; font-weight: 900; letter-spacing: .1em;
    padding: 6px 20px; border-radius: 999px; background: #1a1230; color: var(--c); white-space: nowrap; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 7; pointer-events: none; }
</style>
</head>
<body>
<main class="scene">
  <div id="stage"></div>
  <h1 id="hook"></h1>
  <div id="caps"></div>
  <div id="flash"></div>
</main>
{{AUDIO}}
<script>
const data = {{DATA}};
// Lip-sync sources: one gm.audio per line, created up front (GiveMotion requires it at the top).
const AU = {};
(data.lines || []).forEach(l => { AU[l.n] = gm.audio('#a' + l.n); });

const tl = gm.timeline();
const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const r3 = (v) => Math.round(v * 1000) / 1000;            // no locale, no e-notation in CSS strings
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eOut = (p) => 1 - Math.pow(1 - p, 3), eIn = (p) => p * p * p;
const eIO = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const expo = (p) => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const back = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);

// ---------- colour + svg helpers ----------
const INK = '#231c35', BI = '#5a5170', MOUTH = '#6e1f30', TONGUE = '#ff7b8f';
let U = 0; const uid = () => 'k' + (++U);
const okc = (c, d) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c || '') ? c : d;
const hex = (c) => { c = c.slice(1); if (c.length === 3) c = c.replace(/./g, '$&$&'); return [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16)); };
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, '0')).join(''); };
const dk = (c, p = .22) => mix(c, '#2a1840', p), lt = (c, p = .35) => mix(c, '#ffffff', p);
const rr = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); return `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`; };
const el = (cx, cy, rx, ry = rx) => `M${cx - rx} ${cy}A${rx} ${ry} 0 1 0 ${cx + rx} ${cy}A${rx} ${ry} 0 1 0 ${cx - rx} ${cy}Z`;
// shaded part: fill + cel-shade crescent (light from top-left) + bold outline
const P = (d, f, o = {}) => { const id = uid(), s = o.sh ?? 14; return `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${dk(f, o.dk ?? .2)}"/><g clip-path="url(#${id})"><path d="${d}" fill="${f}" transform="translate(${-s * .55} ${-s})"/></g><path d="${d}" fill="none" stroke="${INK}" stroke-width="${o.sw ?? 7}" stroke-linejoin="round"/>`; };
const F = (d, f, sw = 7, ink = INK) => `<path d="${d}" fill="${f}"${sw ? ` stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round"` : ''}/>`;
const LN = (d, w = 6, c = INK, x = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${x}/>`;
const LB = (d, f, w) => LN(d, w + 14) + LN(d, w, f);       // outlined limb / tube
const HL = (d, w = 10, o = .7) => LN(d, w, '#fff', ` opacity="${o}"`);

// ---------- the shared cartoon face (face units: eyes at y 0, x ±44; mouth at y my) ----------
function face(x, y, s, lid, my = 72, o = {}) {
  const eye = (sx) => {
    const cx = sx * 44, ou = cx + sx * 32, inn = cx - sx * 32, id = uid();
    const lidp = (a, b) => `<path d="M${ou} -46L${inn} -46L${inn} ${b}L${ou} ${a}Z" fill="${lid}"/>` + LN(`M${ou} ${a}L${inn} ${b}`, 6);
    return `<g class="eo"><clipPath id="${id}"><ellipse cx="${cx}" cy="0" rx="25" ry="30"/></clipPath>
      <ellipse cx="${cx}" cy="0" rx="25" ry="30" fill="#fff"/>
      <g clip-path="url(#${id})"><g class="look"><g class="pup"><circle cx="${cx}" cy="4" r="14.5" fill="${INK}"/><circle cx="${cx + 5}" cy="-2" r="5.5" fill="#fff"/><circle cx="${cx - 5}" cy="10" r="2.5" fill="#fff"/></g></g>
        <g class="mv angry">${lidp(-27, -4)}</g><g class="mv sad">${lidp(-4, -26)}</g><g class="mv smug">${lidp(-3, -3)}</g>
        <g class="mv happy"><path d="M${ou} 46L${inn} 46L${inn} 22Q${cx} 6 ${ou} 22Z" fill="${lid}"/>${LN(`M${inn} 22Q${cx} 6 ${ou} 22`, 6)}</g></g>
      <ellipse cx="${cx}" cy="0" rx="25" ry="30" fill="none" stroke="${INK}" stroke-width="6"/>
      ${o.lash ? LN(`M${cx + sx * 20} -20L${cx + sx * 32} -30M${cx + sx * 25} -8L${cx + sx * 38} -12`, 5) : ''}</g>
      <g class="mv dead">${LN(`M${cx - 15} -15L${cx + 15} 15M${cx + 15} -15L${cx - 15} 15`, 9)}</g>`;
  };
  const teeth = `<path d="M-24 -4H24V7Q0 10 -24 7Z" fill="#fff"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <g class="mv happy smug"><ellipse cx="-66" cy="40" rx="18" ry="10" fill="#ff5d8f" opacity=".45"/><ellipse cx="66" cy="40" rx="18" ry="10" fill="#ff5d8f" opacity=".45"/></g>
    <g class="eyes">${eye(-1)}${eye(1)}</g>
    ${LN('M-68 -46Q-44 -60 -20 -47', 10, INK, ' class="brow l"')}${LN('M20 -47Q44 -60 68 -46', 10, INK, ' class="brow r"')}
    <g transform="translate(0 ${my})">
      <g class="mc">
        <g class="mv neutral">${LN('M-20 -2Q0 12 20 -2', 7)}</g>
        <g class="mv happy">${F('M-34 -6Q0 0 34 -6Q30 34 0 36Q-30 34 -34 -6Z', MOUTH, 6)}<path d="M-26 -3Q0 2 26 -3V5Q0 9 -26 5Z" fill="#fff"/><path d="M-15 27Q0 15 15 27Q8 33 0 33Q-8 33 -15 27Z" fill="${TONGUE}"/></g>
        <g class="mv angry">${F(rr(-30, -12, 60, 26, 10), '#fff', 6)}${LN('M-30 1H30M-15 -12V14M0 -12V14M15 -12V14', 4)}</g>
        <g class="mv sad">${LN('M-22 10Q0 -8 22 10', 7)}</g>
        <g class="mv shocked">${F(el(0, 8, 15, 21), MOUTH, 6)}</g>
        <g class="mv smug">${LN('M-22 4Q4 13 26 -9', 7)}</g>
        <g class="mv scared">${F(rr(-30, -11, 60, 24, 10), '#fff', 6)}${LN('M-28 1Q-21 -7 -14 1T0 1T14 1T28 1', 4)}</g>
        <g class="mv dead">${F('M4 0Q4 28 15 28Q26 28 24 0Z', TONGUE, 5)}${LN('M-22 0H26', 7)}</g>
      </g>
      <g class="mo">${F('M-31 -4Q0 -10 31 -4Q29 40 0 42Q-29 40 -31 -4Z', MOUTH, 6)}<path d="M-15 31Q0 19 15 31Q8 39 0 39Q-8 39 -15 31Z" fill="${TONGUE}"/><g class="mv angry scared smug happy">${teeth}</g></g>
    </g>
    <g class="mv sad drip"><path d="M72 22Q84 40 72 48Q60 40 72 22Z" fill="#7fd4ff" stroke="${INK}" stroke-width="4"/></g>
    <g class="mv scared bob"><path d="M92 -78Q106 -56 92 -46Q78 -56 92 -78Z" fill="#9fe2ff" stroke="${INK}" stroke-width="4"/></g>
    <g class="mv angry">${LN('M74 -92Q84 -82 74 -72M100 -92Q90 -82 100 -72M77 -96Q87 -86 97 -96M77 -68Q87 -78 97 -68', 6, '#ff3b4e')}</g>
  </g>`;
}

// ---------- character library: (k = main colour) -> { w, h (floor line), svg, people? } ----------
const SH = '#3a3350';
const legsShoes = (x1, x2, top, bot, shoe = '#fff') => LB(`M${x1} ${top}V${bot - 10}`, SH, 14) + LB(`M${x2} ${top}V${bot - 10}`, SH, 14) + F(el(x1 - 8, bot - 12, 28, 13), shoe, 6) + F(el(x2 + 8, bot - 12, 28, 13), shoe, 6);
const LIB = {
  toaster: k => ({ w: 420, h: 404, svg:
    P(rr(96, 36, 100, 124, 32), '#e9a55a') + P(rr(226, 50, 98, 110, 32), '#e9a55a') + LN('M112 62Q146 50 180 62', 5, '#c17a34') + LN('M242 74Q275 62 308 74', 5, '#c17a34')
    + F(rr(70, 360, 66, 40, 14), SH) + F(rr(284, 360, 66, 40, 14), SH)
    + P(rr(386, 210, 22, 110, 10), '#4b4560') + P(rr(372, 200, 46, 30, 13), '#ff5a5f')
    + P(rr(28, 108, 364, 268, 86), k, { sh: 24 }) + F(rr(94, 116, 108, 18, 9), SH, 0) + F(rr(218, 116, 108, 18, 9), SH, 0)
    + LN('M60 300Q210 330 360 300', 5, dk(k, .18)) + HL('M64 236Q62 168 118 146', 13) + HL('M62 270V284', 13)
    + face(210, 226, .95, k, 70) }),
  phone: k => ({ w: 300, h: 548, svg:
    legsShoes(115, 185, 440, 548)
    + P(rr(38, 8, 224, 460, 48), k, { sh: 20 }) + F(rr(256, 110, 12, 56, 5), dk(k, .3), 5)
    + F(rr(58, 48, 184, 380, 26), '#cdeeff', 6) + `<path d="M64 60L150 54L64 200Z" fill="#fff" opacity=".45"/>`
    + F(rr(118, 22, 64, 14, 7), SH, 0) + F(rr(122, 410, 56, 8, 4), '#8aa4bf', 0)
    + F(rr(76, 62, 34, 10, 5), '#8aa4bf', 0) + F(rr(196, 62, 30, 12, 4), 'none', 3, '#8aa4bf')
    + HL('M52 120V60Q52 30 80 24', 11)
    + face(150, 214, .88, '#cdeeff', 74) }),
  fridge: k => ({ w: 340, h: 612, svg:
    F(rr(50, 584, 44, 26, 10), SH) + F(rr(246, 584, 44, 26, 10), SH)
    + P(rr(20, 8, 300, 584, 46), k, { sh: 24, dk: .16 }) + LN('M24 196H316', 7)
    + P(rr(42, 70, 20, 96, 10), '#9aa3b5') + P(rr(42, 226, 20, 140, 10), '#9aa3b5')
    + `<g transform="rotate(-8 190 100)">${P(rr(150, 50, 70, 84, 6), '#fff3a3', { sh: 8, sw: 5 })}${LN('M162 76H206M162 92H200M162 108H190', 4, '#d0a85a')}</g>`
    + F(el(256, 70, 16), '#ff5a5f', 5) + F(el(276, 128, 12), '#5ab0ff', 5)
    + HL('M38 140V58Q38 30 66 26', 11) + HL('M300 420V560', 9, .35)
    + face(176, 350, 1.08, k, 74) }),
  router: k => ({ w: 420, h: 362, svg:
    LB('M112 170L84 46', '#4b4560', 14) + LB('M210 160V30', '#4b4560', 14) + LB('M308 170L336 46', '#4b4560', 14)
    + F(el(84, 40, 17), '#ff5a5f') + F(el(210, 24, 17), '#ffd23f') + F(el(336, 40, 17), '#5ef2c2')
    + [0, 1, 2].map(i => `<path class="blk" style="animation-delay:${-i * .5}s" d="M${180 - i * 22} ${-6 - i * 16}Q210 ${-24 - i * 20} ${240 + i * 22} ${-6 - i * 16}" fill="none" stroke="#5ef2c2" stroke-width="8" stroke-linecap="round"/>`).join('')
    + F(rr(60, 330, 66, 30, 12), SH) + F(rr(294, 330, 66, 30, 12), SH)
    + P(rr(20, 140, 380, 200, 60), k, { sh: 22 }) + F(rr(66, 296, 288, 26, 13), dk(k, .45), 0)
    + [0, 1, 2, 3, 4, 5, 6].map(i => `<circle class="blk" style="animation-delay:${-i * .37}s" cx="${90 + i * 40}" cy="309" r="7" fill="${i % 3 ? '#5ef2c2' : '#ffd23f'}"/>`).join('')
    + HL('M48 250Q46 176 100 160', 12)
    + face(210, 206, .78, k, 70) }),
  laptop: k => ({ w: 440, h: 368, svg:
    P(rr(48, 14, 344, 262, 28), k, { sh: 18 }) + F(rr(68, 34, 304, 212, 16), '#d9f1ff', 6) + `<path d="M76 44L190 40L76 170Z" fill="#fff" opacity=".45"/>`
    + F(el(220, 24, 4), SH, 0)
    + P('M14 284H426L410 352Q407 364 394 364H46Q33 364 30 352Z', lt(k, .3), { sh: 10 })
    + [0, 1, 2].map(r => Array.from({ length: 11 }, (_, i) => F(rr(62 + i * 29 - r * 4 + (r ? 4 : 0), 294 + r * 18, 22, 11, 3), dk(k, .3), 0)).join('')).join('')
    + face(220, 132, .9, '#d9f1ff', 76) }),
  mug: k => ({ w: 380, h: 376, svg:
    [0, 1, 2].map(i => `<g class="rise" style="animation-delay:${-i * .85}s">${LN(`M${130 + i * 46} 70Q${112 + i * 46} 50 ${130 + i * 46} 30T${130 + i * 46} -10`, 9, '#fff', ' opacity=".8"')}</g>`).join('')
    + LB('M292 156Q370 156 370 230Q370 304 292 304', dk(k, .05), 26)
    + P('M48 98H302V306Q302 372 238 372H112Q48 372 48 306Z', k, { sh: 24 })
    + F(el(175, 98, 127, 26), lt(k, .2), 7) + F(el(175, 103, 106, 16), '#6b3a22', 0) + HL('M120 98Q150 92 180 94', 6, .5)
    + `<path d="M260 160c-10 -18 -34 -10 -26 8 4 9 26 22 26 22s22 -13 26 -22c8 -18 -16 -26 -26 -8z" fill="${lt(k, .55)}" opacity=".85"/>`
    + HL('M76 150V266', 13, .6)
    + face(160, 216, .9, k, 74) }),
  alarm_clock: k => ({ w: 380, h: 456, svg:
    LB('M122 48Q190 4 258 48', '#4b4560', 12)
    + P(el(92, 104, 56), '#ffd23f') + P(el(288, 104, 56), '#ffd23f') + LB('M190 92V66', '#4b4560', 10) + F(el(190, 62, 13), '#4b4560', 6)
    + LB('M112 384L80 436', '#4b4560', 14) + LB('M268 384L300 436', '#4b4560', 14) + F(el(76, 442, 24, 11), SH, 6) + F(el(304, 442, 24, 11), SH, 6)
    + P(el(190, 246, 166), k, { sh: 26 }) + F(el(190, 246, 130), '#fffaf0', 7)
    + Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6, r1 = i % 3 ? 116 : 110, r2 = 124; return LN(`M${r3(190 + Math.sin(a) * r1)} ${r3(246 - Math.cos(a) * r1)}L${r3(190 + Math.sin(a) * r2)} ${r3(246 - Math.cos(a) * r2)}`, i % 3 ? 4 : 7); }).join('')
    + HL('M58 210Q66 130 130 98', 13)
    + face(190, 232, .95, '#fffaf0', 70) }),
  car: k => ({ w: 460, h: 348, svg:
    F(rr(44, 262, 86, 84, 26), '#2f2a40') + F(rr(330, 262, 86, 84, 26), '#2f2a40')
    + P('M108 156L136 52Q141 34 160 34H300Q319 34 324 52L352 156Z', k, { sh: 16 })
    + F('M134 146L158 64Q161 54 172 54H288Q299 54 302 64L326 146Z', '#cdeeff', 6) + `<path d="M150 136L170 62L216 62L170 136Z" fill="#fff" opacity=".45"/>`

const kindOf = (kind, name) => {
  if (LIB[kind]) return kind;
  const s = (kind + ' ' + name).toLowerCase();
  if (/woman|girl|lady|mom|mum|grandma|wife|sister|queen/.test(s)) return 'person_woman';
  if (/kid|child|boy|baby|son|daughter/.test(s)) return 'person_kid';
  if (/old|grand|elder|senior/.test(s)) return 'person_old';
  if (/person|human|man|guy|dad|husband|brother|boss|teacher|doctor|king|friend|people/.test(s)) return 'person_man';
  if (/cat|kitten/.test(s)) return 'cat';
  if (/dog|puppy/.test(s)) return 'dog';
  return 'mug';
};

}

function win(x, y, w, h, o = {}) {

const stage = document.getElementById('stage');
const S = scenes.map((sc, i) => {
  const list = (sc.cast || []).slice(0, 3).map((c, j) => ({ ...c, j })).sort((a, b) => (ORDER[a.at] ?? 1) - (ORDER[b.at] ?? 1) || a.j - b.j);
  const n = list.length, K = n === 3 ? .72 : 1;
  const el0 = document.createElement('div'); el0.className = 'shot';
  let html = `<div class="wrap"><div class="cam"><div class="bg">${bgSvg(sc.bg)}</div>`;
  const chars = list.map((c, j) => {
    const info = cast[c.name] || {}, kind = kindOf(info.kind, c.name), col = okc(info.color, DEFCOL[kind]);
    const art = LIB[kind](col), x = SLOTS[n][j];
    html += `<div class="ch" data-mood="neutral" style="left:${x - art.w / 2}px;top:${1500 - art.h}px;width:${art.w}px;height:${art.h}px"><div class="shd"></div><div class="rig"><svg viewBox="0 0 ${art.w} ${art.h}" width="${art.w}" height="${art.h}">${art.svg}</svg></div></div>`;
    return { name: c.name, x, K, h: art.h, side: n === 1 ? (i % 2 ? 1 : -1) : (x < 540 ? -1 : 1), ph: (i * 1.7 + j * 2.3) % 6.28, people: !!art.people,
      act: sc.action && sc.action.who === c.name ? sc.action : null, mood: '', filt: '' };
  });
  el0.innerHTML = html + `</div></div>`; stage.append(el0);
  el0.querySelectorAll('.ch').forEach((node, j) => Object.assign(chars[j], { node, rig: node.querySelector('.rig'), shd: node.querySelector('.shd'),
    eyes: node.querySelector('.eyes'), looks: node.querySelectorAll('.look'), mc: node.querySelector('.mc'), mo: node.querySelector('.mo'),
    head: node.querySelector('.head'), armL: node.querySelector('.armL'), armR: node.querySelector('.armR') }));
  return { sc, el: el0, wrap: el0.querySelector('.wrap'), cam: el0.querySelector('.cam'), chars, dir: i % 2 ? 1 : -1 };
});

// one character, one frame (t = video time)
function animChar(C, t, Z, spk) {
  const [mood, since] = moodAt(C.name, t), dead = mood === 'dead';
  if (C.mood !== mood) { C.node.dataset.mood = mood; C.mood = mood; }
  const L = (linesOf[C.name] || []).find(l => t >= l.start && t <= l.start + l.dur);
  const talk = L && AU[L.n] ? Math.min(1, AU[L.n].level(t) * 2.6) : 0;
  let x = 0, y = 0, rot = 0, sx = 1, sy = 1, g = 1;
  for (const l of linesOf[C.name] || []) { const v = t - l.start; if (v >= 0 && v < .42) { const p = Math.sin(Math.PI * v / .42); y -= p * 34; sy *= 1 + .05 * p; sx *= 1 - .03 * p; } }
  if (!dead) { const b = Math.sin(t * 2.4 + C.ph); sy *= 1 + b * .013; sx *= 1 - b * .008; rot += Math.sin(t * 1.3 + C.ph) * 1.1; }
  sy *= 1 + talk * .05; sx *= 1 - talk * .025; rot += Math.sin(t * 6 + C.ph) * talk * 3.2;
  const A = C.act, v = A ? t - A.at : -1, side = C.side;
  if (A) switch (A.move) {
    case 'bounce': if (v >= 0 && v < 1.1) { const k = Math.abs(Math.sin(v * Math.PI * 2.75)) * (1 - v / 1.1); y -= k * 80; if (k < .25) { sy *= .9 + k * .4; sx *= 1.08 - k * .32; } } break;
    case 'shake': if (v >= 0 && v < .9) { const a = 1 - v / .9; x += Math.sin(v * 58) * 22 * a; rot += Math.sin(v * 47) * 7 * a; } break;
    case 'jump': if (v >= 0 && v < 1.1) {
      if (v < .15) { const p = Math.sin(Math.PI / 2 * v / .15); sy *= 1 - .16 * p; sx *= 1 + .1 * p; }
      else if (v < .8) { const p = (v - .15) / .65; y -= 4 * p * (1 - p) * 230; sy *= 1 + .12 * Math.cos(Math.PI * p); sx *= 1 - .06 * Math.cos(Math.PI * p); rot += side * 8 * Math.sin(Math.PI * p); }
      else { const p = Math.sin(Math.PI * (v - .8) / .3); sy *= 1 - .16 * p; sx *= 1 + .12 * p; } } break;
    case 'spin': if (v >= 0 && v < .9) { const p = eIO(v / .9); sx *= Math.cos(p * Math.PI * 4); y -= Math.sin(Math.PI * v / .9) * 60; } break;
    case 'fall': if (v >= 0) { const p = Math.min(1, v / .42); let a = 84 * p * p; if (v > .42 && v < .8) a -= Math.sin(Math.PI * (v - .42) / .38) * 9 * (1 - (v - .42) / .38); rot += side * a; const sn = Math.sin(a * Math.PI / 180); y -= sn * 90; x -= side * sn * C.h * .5 * C.K; } break;
    case 'enter': if (v < 0) x += side * 900; else if (v < .65) { const p = back(v / .65, 1.4); x += side * 900 * (1 - p); y -= Math.abs(Math.sin(v * 20)) * 24 * (1 - v / .65); } break;
    case 'exit': if (v >= 0) { if (v < .14) { x -= side * 26 * Math.sin(Math.PI / 2 * v / .14); sx *= 1 + .06 * v / .14; } else { const p = eIn(Math.min(1, (v - .14) / .5)); x += side * (1000 * p - 26 * (1 - p)); y -= Math.abs(Math.sin(v * 22)) * 20 * (1 - p); } } break;
    case 'grow': if (v >= 0 && v < 1.5) g = 1 + (v < .25 ? back(v / .25, 2.2) * .55 : v < .85 ? .55 + Math.sin((v - .25) * 32) * .04 * (1 - (v - .25) / .6) : .55 * (1 - eIO((v - .85) / .65))); break;
  }
  if (dead) { const p = eOut(clamp((t - since) / .5)); rot += side * 7 * p; sy *= 1 - .07 * p; y += 6 * p; }
  const K = C.K;
  C.rig.style.transform = `translate(${r3(x)}px,${r3(y)}px) rotate(${r3(rot)}deg) scale(${r3(sx * K * g)},${r3(sy * K * g)})`;
  const lift = clamp(-y / 320, 0, .6);
  C.shd.style.transform = `translateX(${r3(x)}px) scale(${r3(K * g * (1 - lift) * (A && A.move === 'fall' && v > .2 ? 1.5 : 1))})`; C.shd.style.opacity = r3(1 - lift);
  // attention: others dim slightly while a cast member in this scene talks; dead = desaturated
  const f = (spk && spk !== C.name ? 'brightness(.84) saturate(.85) ' : '') + (dead ? 'saturate(.22) brightness(.92)' : '');
  if (f !== C.filt) { C.rig.style.filter = f || 'none'; C.filt = f; }
  if (!dead) { const bt = (t + 1.3 + C.ph * 1.9) % 3.7; C.eyes.style.transform = `scaleY(${bt < .12 || (C.ph > 3 && bt > .3 && bt < .4) ? .1 : 1})`; }
  const tgt = spk && spk !== C.name ? (Z.chars.find(o => o.name === spk) || {}).x : (C.x === 540 ? 540 + Math.sin(t * .7 + C.ph) * 300 : 540);
  const lx = clamp(((tgt ?? 540) - C.x) / 40, -7, 7);
  C.looks.forEach(n => { n.style.transform = `translate(${r3(lx)}px,${talk > .1 ? 2 : 0}px)`; });
  const open = talk > .1;
  C.mc.style.opacity = open ? 0 : 1; C.mo.style.opacity = open ? 1 : 0;
  if (open) C.mo.style.transform = `scale(${r3(.78 + talk * .32)},${r3(.25 + talk * .85)})`;
  if (C.people && !dead) {
    C.head.style.transform = `rotate(${r3(Math.sin(t * 5 + C.ph) * talk * 5 + Math.sin(t * 1.1 + C.ph) * 1.6)}deg)`;
    const gest = talk * (.55 + .45 * Math.sin(t * 4.2 + C.ph));
    C.armL.style.transform = `rotate(${r3(4 + Math.sin(t * 2 + C.ph) * 2 + gest * 22)}deg)`;
    C.armR.style.transform = `rotate(${r3(-4 - Math.sin(t * 2.2 + C.ph) * 2 - gest * 34)}deg)`;
  }
}

const flashEl = document.getElementById('flash');
gm.onFrame(t => {
  let flash = 0; const cur = lineAt(t);
  S.forEach((Z, i) => {
    const sc = Z.sc, u = t - sc.start, next = S[i + 1];
    const vis = (i === 0 || t >= sc.start) && !(next && t >= next.sc.start + .34);
    Z.el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    // whip in from alternating sides; the old scene is shoved the other way
    let wx = 0, bl = 0;
    if (i && u < .32) { const p = expo(u / .32); wx = Z.dir * 1080 * (1 - p); bl = 18 * (1 - p); }
    if (next && t >= next.sc.start) wx = -next.dir * 420 * expo(Math.min(1, (t - next.sc.start) / .32));
    Z.wrap.style.transform = `translateX(${r3(wx)}px)`; Z.wrap.style.filter = bl > .4 ? `blur(${r3(bl)}px)` : 'none';
    // camera
    const d = Math.max(.5, sc.end - sc.start + .35), e = eIO(clamp(u / d));
    let s = 1.03 + .04 * e, cx = 0, cy = 0;
    switch (sc.camera) {
      case 'push_in': s = 1.02 + .11 * e; break;
      case 'pull_out': s = 1.14 - .12 * e; break;
      case 'pan_left': s = 1.08; cx = 40 - 80 * e; break;
      case 'pan_right': s = 1.08; cx = -40 + 80 * e; break;
      case 'punch_zoom': s = u < .05 ? 1.02 : u < .25 ? 1.02 + .2 * expo((u - .05) / .2) : 1.22 - .08 * eIO(clamp((u - .25) / (d - .25)));
        if (u >= .05 && u < .35) flash = Math.max(flash, .55 * (1 - (u - .05) / .3)); break;
      case 'shake': s = 1.07; { const v = u - .1; if (v >= 0 && v < .8) { const a = 26 * Math.exp(-5 * v); cx += a * Math.sin(v * 63); cy += a * Math.cos(v * 51); } } break;
    }
    Z.cam.style.transform = `translate(${r3(cx)}px,${r3(cy)}px) scale(${r3(s)})`;
    const spk = cur && Z.chars.some(c => c.name === cur.speaker) ? cur.speaker : null;
    Z.chars.forEach(C => animChar(C, t, Z, spk));
  });
  flashEl.style.opacity = r3(flash);
});

// ---------- hook: on screen at frame 0 (thumbnail), then out of the way ----------
document.getElementById('hook').innerHTML = String(data.hook || '').split(/\s+/).filter(Boolean).map(w => `<span class="w">${esc(w)}</span>`).join(' ');
tl.from('#hook .w', { y: -26, rotate: -3, duration: .5, ease: 'back.out(2.2)', stagger: .07 }, 0)   // frame 0 stays fully readable (thumbnail)
  .to('#hook', { scale: .8, y: -60, opacity: 0, duration: .3, ease: 'power2.in' }, 2.6);

// ---------- captions: 1-3 word phrases, sliding pill in the speaker's colour, name tag for characters ----------
const colour = (sp) => sp === 'narrator' || !cast[sp] ? '#ffd23f' : okc(cast[sp].caption, '#ffffff');
const phrases = [[]];
(data.words || []).forEach((w, i) => {
  const cur = phrases.at(-1), prev = data.words[i - 1];
  if (cur.length && (cur.length === 3 || w.speaker !== prev.speaker || w.start - prev.end > .3 || /[.!?,]$/.test(prev.text))) phrases.push([]);
  phrases.at(-1).push(w);
});
if (!phrases[0].length) phrases.length = 0;
const caps = phrases.map(ph => {
  const el = document.createElement('div'); el.className = 'cap'; el.style.setProperty('--c', colour(ph[0].speaker));
  const tag = ph[0].speaker !== 'narrator' ? `<span class="tag">${esc(String(ph[0].speaker).toUpperCase())}</span>` : '';
  el.innerHTML = tag + '<i class="pill"></i>' + ph.map(w => `<span class="w">${esc(w.text)}</span>`).join(' ');
  document.getElementById('caps').append(el); return el;
});
gm.wait(document.fonts.ready.then(() => phrases.forEach((ph, p) => {
  const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
  const box = i => ({ x: spans[i].offsetLeft, y: spans[i].offsetTop, width: spans[i].offsetWidth });
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .01 }, Math.max(0, ph[0].start - .07));
  tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .2, ease: 'back.out(2)' }, Math.max(0, ph[0].start - .04));
  ph.forEach((w, i) => {
    tl.fromTo(spans[i], { opacity: 0, y: 36, scale: .6, rotate: (i % 2 ? 5 : -5) }, { opacity: 1, y: 0, scale: 1, rotate: 0, duration: .26, ease: 'back.out(2.6)' }, Math.max(0, w.start - .06));
    if (i) tl.to(pill, { ...box(i), duration: .12, ease: 'power3.out' }, w.start - .1);
    tl.to(spans[i], { color: '#1a1230', webkitTextStroke: '0px #1a1230', scale: 1.06, duration: .06 }, Math.max(0, w.start - .03))
      .to(spans[i], { color: '#fff', webkitTextStroke: '3px #1a1230', scale: 1, duration: .06 }, ph[i + 1] ? ph[i + 1].start - .1 : w.end + .25);
  });
  const end = next ? next[0].start - .16 : ph.at(-1).end + .35;
  tl.to(el, { y: -50, opacity: 0, duration: .14, ease: 'power2.in' }, end);
})));
</script>
</body>
</html>
