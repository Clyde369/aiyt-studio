<!doctype html>
<!--
  AIYT Studio story part, 8-bit style. Look: true pixel art (216x384 grid, 32 colours) shown with crisp pixels, a light
  CRT scanline layer, chunky block wipes between scenes. Type: Press Start 2P for the hook, name tabs and buttons; VT323
  for the subtitles, which live in an RPG dialogue box in the lower band (y 1250-1530): above YouTube's buttons, below
  faces. Motion: every picture keeps moving; words type out in time with the voice; a pixel SUBSCRIBE button and
  "PART 2" tag appear when the narrator asks. The app fills in the length, shots, audio and data placeholders below.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="{{TOTAL}}" data-safe-zone="shorts">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Px; src: url(fonts/PressStart2P-Regular.ttf); }
  @font-face { font-family: Term; src: url(fonts/VT323-Regular.ttf); }
  body { background: #05050c; color: #fff; overflow: hidden; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .wrap { position: absolute; inset: 0; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; transform-origin: 50% 38%; }
  #crt { position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgb(0 0 0 / .16) 0 2px, transparent 2px 5px),
                radial-gradient(120% 90% at 50% 45%, transparent 55%, rgb(0 0 0 / .55) 100%); }
  #shade { position: absolute; left: 0; right: 0; bottom: 0; height: 820px; z-index: 3;
    background: linear-gradient(180deg, transparent, rgb(0 0 0 / .55) 45%, rgb(0 0 0 / .7)); }
  #wipe { position: absolute; inset: 0; z-index: 7; display: grid; grid-template-columns: repeat(12, 90px); grid-template-rows: repeat(22, 90px); }
  #wipe i { background: #05050c; transform: scale(0); }
  #hook { position: absolute; left: 60px; right: 60px; top: 250px; margin: 0; z-index: 6; text-align: center;
    font: 64px/1.35 Px; color: #fff; text-shadow: 6px 6px 0 #000, -2px -2px 0 #000; letter-spacing: .02em; }
  #hook .c { display: inline-block; }
  #box { position: absolute; left: 50px; right: 50px; top: 1262px; height: 262px; z-index: 8; padding: 26px 34px;
    background: rgb(8 10 28 / .9); image-rendering: pixelated;
    box-shadow: 0 0 0 6px #f2f2f2, 0 0 0 12px #0b0b18, 12px 12px 0 12px rgb(0 0 0 / .5); }
  #name { position: absolute; left: 28px; top: -38px; padding: 12px 16px 10px; font: 24px/1 Px; color: #0b0b18; background: var(--c, #ffd23f);
    box-shadow: 0 0 0 6px #0b0b18; }
  #text { font: 88px/0.94 Term; color: #fff; letter-spacing: .01em; text-shadow: 4px 4px 0 #000; }
  #text .w { display: inline-block; margin-right: .28em; opacity: 0; }
  #text .w.hot { color: var(--c, #ffd23f); }
  #cursor { position: absolute; right: 30px; bottom: 18px; font: 28px/1 Px; color: #f2f2f2; }
  #cta { position: absolute; left: 0; right: 0; top: 1020px; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; }
  #sub { font: 44px/1 Px; color: #fff; background: #e01b24; padding: 26px 36px 22px; box-shadow: 0 0 0 6px #fff, 0 0 0 12px #0b0b18, 10px 10px 0 12px rgb(0 0 0 / .5); }
  #part2 { font: 30px/1 Px; color: #ffd23f; text-shadow: 4px 4px 0 #000; }
</style>
</head>
<body>
<main class="scene">
{{SHOTS}}
  <div id="shade"></div>
  <div id="crt"></div>
  <h1 id="hook"></h1>
  <div id="cta" data-check="carry-ok"><div id="sub">▶ SUBSCRIBE</div><div id="part2">PART 2 COMING ▶▶</div></div>
  <div id="box"><div id="name" data-check="carry-ok"></div><div id="text"></div><div id="cursor" data-check="carry-ok">▼</div></div>
  <div id="wipe"></div>
</main>
{{AUDIO}}
<script>
const data = {{DATA}};
const tl = gm.timeline();
const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Hook: on screen at frame 0 (it is the thumbnail), letters drop in like an arcade title, then it clears.
document.getElementById('hook').innerHTML = String(data.hook || '').split(' ').map((w) => `<span style="white-space:nowrap">${[...w].map((ch) => `<span class="c">${esc(ch)}</span>`).join('')}</span>`).join(' ');
tl.from('#hook .c', { y: -40, opacity: 0, duration: .12, ease: 'steps(3)', stagger: .025 }, 0)
  .to('#hook', { opacity: 0, y: -30, duration: .2, ease: 'steps(4)' }, 2.6);

// Shots: each picture keeps moving (tweens inside a shot count from that shot's own start).
data.scenes.forEach((sc, i) => {
  const st = gm.timeline(`#s${i}`), d = (i === data.scenes.length - 1 ? data.total : sc.end + .35) - sc.start, m = sc.camera;
  if (m === 'push_in') st.fromTo('img', { scale: 1.02 }, { scale: 1.14, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pull_out') st.fromTo('img', { scale: 1.16 }, { scale: 1.02, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pan_left') st.fromTo('img', { scale: 1.14, x: 55 }, { x: -55, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'pan_right') st.fromTo('img', { scale: 1.14, x: -55 }, { x: 55, duration: d, ease: 'sine.inOut' }, 0);
  else if (m === 'punch_zoom') st.fromTo('img', { scale: 1 }, { scale: 1.22, duration: .18, ease: 'expo.out' }, .05).to('img', { scale: 1.16, duration: d - .3, ease: 'sine.inOut' }, .25);
  else st.fromTo('img', { scale: 1.1 }, { scale: 1.16, duration: d, ease: 'sine.inOut' }, 0);
});
// Block wipe between scenes: a diagonal of black squares covers the cut and clears again.
const wipe = document.getElementById('wipe');
for (let r = 0; r < 22; r++) for (let c = 0; c < 12; c++) { const b = document.createElement('i'); b.dataset.d = r + c; wipe.append(b); }
const blocks = [...wipe.children];
data.scenes.slice(1).forEach((sc) => {
  blocks.forEach((b) => {
    const at = sc.start - .2 + (+b.dataset.d) * .006;
    tl.to(b, { scale: 1, duration: .06, ease: 'steps(2)' }, at).to(b, { scale: 0, duration: .06, ease: 'steps(2)' }, at + .2);
  });
});
const shakes = data.scenes.filter((s) => s.camera === 'shake').map((s) => s.start + .1);
gm.onFrame((t) => {
  let sx = 0, sy = 0;
  for (const s of shakes) { const u = t - s; if (u >= 0 && u < .6) { const a = 18 * Math.exp(-6 * u); sx += Math.round(a * Math.sin(u * 63) / 5) * 5; sy += Math.round(a * Math.cos(u * 51) / 5) * 5; } }
  document.querySelectorAll('.shot').forEach((el) => { el.style.translate = `${sx}px ${sy}px`; });
});

// Dialogue box: one spoken line per page, words typed out in time with the voice, a name tab for characters.
const colour = (who) => (data.cast[who] && data.cast[who].caption) || '#ffd23f';
const box = document.getElementById('box'), nameEl = document.getElementById('name'), textEl = document.getElementById('text');
const firstStart = data.lines.length ? data.lines[0].start : 0;
tl.fromTo('#box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .18, ease: 'steps(3)' }, Math.max(0, firstStart - .25));
const pages = data.pages;
let shown = -1;
gm.onFrame((t) => {
  let i = -1;
  for (let k = 0; k < pages.length; k++) if (t >= pages[k].start - .08) i = k;
  if (i !== shown) {
    shown = i;
    const pg = pages[i];
    if (pg) {
      box.style.setProperty('--c', colour(pg.speaker));
      nameEl.style.display = pg.speaker === 'narrator' ? 'none' : 'block';
      nameEl.textContent = String(pg.speaker).toUpperCase();
      textEl.innerHTML = pg.words.map((w) => `<span class="w">${esc(w.text)}</span>`).join('');
    } else { textEl.innerHTML = ''; nameEl.style.display = 'none'; }
  }
  const pg = pages[shown];
  if (!pg) return;
  const spans = textEl.children;
  pg.words.forEach((w, k) => {
    const on = t >= w.start - .05;
    spans[k].style.opacity = on ? 1 : 0;
    spans[k].classList.toggle('hot', on && t < w.end);
  });
  const done = t > pg.end + .1;
  document.getElementById('cursor').style.opacity = done && Math.floor(t * 3) % 2 === 0 ? 1 : 0;
});

// The ask: a pixel SUBSCRIBE button and a PART 2 tag while the narrator says it, held to the end.
if (data.cta != null) {
  tl.fromTo('#cta', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .2, ease: 'steps(4)' }, data.cta)
    .fromTo('#sub', { scale: 1 }, { scale: 1.12, duration: .12, ease: 'steps(2)', repeat: 5, yoyo: true }, data.cta + .3);
}
</script>
</body>
</html>
